<!-- todo-panel 真实元素样子：假待办面板 -->
<style>
  .sb-todo { width:100%; border-radius:12px; border:1px solid rgba(255,255,255,.1);
    background: rgba(20,18,30,.72); padding:8px 10px; font-size:12px; color:#e8e6f0; box-sizing:border-box; }
  .sb-todo h4 { margin:0 0 6px; font-size:12px; color:#cfc8dd; font-weight:600; }
  .sb-todo .it { display:flex; gap:6px; align-items:center; padding:2px 0; }
  .sb-todo .box { width:11px; height:11px; border-radius:3px; border:1px solid var(--sw, #7CC8E8); background:rgba(124,200,232,.12); flex:none; }
  .sb-todo .done { text-decoration:line-through; color:#8a86a0; }
</style>
<div class="sb-todo"><h4>📋 任务</h4>
  <div class="it"><span class="box"></span> 写周报</div>
  <div class="it"><span class="box"></span> 回复邮件</div>
  <div class="it"><span class="box" style="background:var(--sw, #7CC8E8)"></span><span class="done">买咖啡</span></div>
</div>
