<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主题配色对照 · 自由选基底对比 + 点击选色</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0a0a12; color: #e8e6f0; padding: 24px; }
  h1 { font-size: 21px; margin-bottom: 4px; letter-spacing: 1px; }
  .sub { font-size: 13px; color: #8a86a0; margin-bottom: 16px; }
  .toolbar { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .pick { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #b8b4c8; }
  .pick select { background: #16122a; color: #e8e6f0; border: 1px solid rgba(212,175,55,.35); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .pick select:focus { outline: none; border-color: #d4af37; }
  .btn-act { padding: 7px 16px; border-radius: 8px; font-size: 13px; border: 1px solid rgba(212,175,55,.4); background: rgba(138,109,155,.2); color: #fdf0fa; cursor: pointer; }
  .btn-act:hover { background: rgba(138,109,155,.35); }
  .btn-act:disabled { opacity: .45; cursor: not-allowed; }
  .btn-apply { padding: 3px 10px; border-radius: 7px; font-size: 11px; border: 1px solid rgba(107,142,90,.55); background: rgba(107,142,90,.2); color: #eafff3; cursor: pointer; font-weight: 600; }
  .btn-apply:hover { background: rgba(107,142,90,.4); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .col { border-radius: 14px; padding: 18px; border: 1px solid rgba(255,255,255,.08); }
  .col h2 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .col .hint { font-size: 11px; color: #8a86a0; font-weight: 400; margin-left: auto; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .swatch { border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; min-height: 46px; }
  .swatch .name { font-weight: 600; }
  .swatch .hex { font-family: 'SF Mono', Consolas, monospace; opacity: .85; }
  .sect { font-size: 12px; color: #8a86a0; margin: 14px 0 8px; letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .sect .tip { font-size: 11px; letter-spacing: 0; color: #6e6478; text-transform: none; }
  .ui { display: flex; gap: 12px; align-items: stretch; }
  .ui-left { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .comp { border-radius: 8px; cursor: pointer; transition: transform .08s; position: relative; }
  .comp:hover { outline: 2px dashed rgba(212,175,55,.5); outline-offset: 2px; }
  .comp:active { transform: scale(.96); }
  .btn { padding: 7px 16px; border-radius: 8px; font-size: 13px; border: 1px solid transparent; }
  .chip { padding: 4px 12px; border-radius: 999px; font-size: 12px; }
  .card { border-radius: 12px; padding: 14px; font-size: 13px; line-height: 1.7; }
  /* 背景切换空块：竖排放在组件区（激活态+三文字整体）右侧的大片空白处 */
  .bg-block {
    width: 92px; flex: none; align-self: stretch;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    border: 2px dashed rgba(212,175,55,.35); border-radius: 12px;
    background: rgba(255,255,255,.03); color: rgba(253,240,250,.55);
    font-size: 11px; letter-spacing: 2px; cursor: pointer; user-select: none;
    transition: background .15s, border-color .15s;
  }
  .bg-block:hover { background: rgba(212,175,55,.1); border-color: rgba(212,175,55,.65); color: rgba(253,240,250,.9); }
  .bg-block:active { transform: scale(.97); }
  .bg-block .bg-dot { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(253,240,250,.35); }
  .text-primary { font-size: 14px; }
  .text-dim { font-size: 13px; }
  .note { margin-top: 22px; font-size: 12px; color: #8a86a0; line-height: 1.8; border-top: 1px solid rgba(255,255,255,.08); padding-top: 12px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(20,16,30,.95); border: 1px solid rgba(107,142,90,.5); color: #fdf0fa; padding: 8px 18px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<h1>🎨 dsh-theme-mediascape · 配色对照（可交互）</h1>
<div class="sub">左右下拉框自由选基底对比；组件模拟区点击任意元素 → 在知更鸟 6 色中循环换色；「导出 CSS」把当前两列配置落盘 preview/generated/</div>

<div class="toolbar">
  <div class="pick">左基底 <select id="pickL"></select></div>
  <div class="pick">右基底 <select id="pickR"></select></div>
  <button class="btn-act" id="btnExport">⬇ 导出 CSS</button>
  <button class="btn-act" id="btnReset">↺ 重置默认</button>
</div>

<div class="cols">
  <div class="col" id="colL"></div>
  <div class="col" id="colR"></div>
</div>

<div class="note" id="note"></div>

<div class="toast" id="toast"></div>

<script>
"use strict";
// ═══════════ 基底池（动态读取：GET /api/theme-bases，来源 preview/bases/*.css + preview/generated/*.css，不写死） ═══════════
let BASES = {};          // { id: { label, badge, bg, bgSoft, bgLayer, swatches, comps, cardStyle, note } }
// 服务端解析的基底已含 swatches/comps/bg；前端补 cardStyle/note（渲染用）
function finalizeBase(b) {
  const bsix = {};
  for (const s of b.swatches) bsix[s.name] = s.hex;
  const eye = bsix['瞳色'] || bsix['强调绿'] || '#7EA36C';
  const gold = bsix['点缀金'] || bsix['萤火金色高亮'] || bsix['金色高亮'] || '#D4AF37';
  const purple = bsix['礼服紫'] || bsix['按钮绿'] || '#8A6D9B';
  b.cardStyle = `background:rgba(24,18,34,.72);border:1px solid rgba(212,175,55,.22)`;
  b.note = b.label + '：6 色基底（点组件换色 · 点背景块换背景 · ⬇ 应用为正式基底）';
  return b;
}
async function loadBases() {
  try {
    const resp = await fetch('/api/theme-bases');
    const j = await resp.json();
    BASES = {};
    for (const b of (j.bases || [])) BASES[b.id] = finalizeBase(b);
  } catch (e) {
    // 接口失败：留空（页面会提示），不阻断
    BASES = {};
  }
  return BASES;
}


// ═══════════ 状态 ═══════════
const state = { L: { base: "robin-bright", comps: {}, bg: null }, R: { base: "firefly", comps: {}, bg: null } };
// comps: { role: { style, text } }——用户点击换色后记录覆盖；bg: 列背景色（null=用基底默认，点过=覆盖）
// 默认基底在 loadBases 完成后校验存在性，不存在回退到第一个

// ═══════════ 工具 ═══════════
const $ = (id) => document.getElementById(id);
function hexToRgb(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function withAlpha(hex, alpha) {
  const c = hexToRgb(hex); if (!c) return hex;
  return `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha})`;
}
function textColorFor(hex) {
  const c = hexToRgb(hex); if (!c) return "#ffffff";
  const lum = 0.299 * c.r + 0.587 * c.g + 0.114 * c.b;
  return lum > 150 ? "#1a1420" : "#fdf0fa";
}

// ═══════════ 渲染单列 ═══════════
function renderCol(side) {
  const st = state[side];
  const base = BASES[st.base];
  const col = $(side === "L" ? "colL" : "colR");
  // 恢复初始 comps（未点过的用基底默认；点过的保留覆盖）
  const comps = {};
  for (const c of base.comps) {
    comps[c.role] = st.comps[c.role] || { style: c.style, text: c.text };
  }
  st.comps = comps;

  const swatchHtml = base.swatches.map((s) => {
    const tc = textColorFor(s.hex);
    return `<div class="swatch" style="background:${s.hex};color:${tc}"><span class="name">${s.name}</span><span class="hex">${s.hex}</span></div>`;
  }).join("");

  const row1 = ["btn-primary", "btn-secondary", "chip-active"].map((role) => {
    const c = comps[role];
    return `<div class="comp btn" data-role="${role}" data-side="${side}" style="${c.style}">${c.text}</div>`;
  }).join("");
  const cardComp = ["text-primary", "text-dim", "text-tertiary", "gold-glow"].map((role) => {
    const c = comps[role];
    return `<div class="comp" data-role="${role}" data-side="${side}" style="${c.style}${role === "gold-glow" ? ";margin-top:6px" : ""}">${c.text}</div>`;
  }).join("");

  col.className = "col";
  col.style.background = st.bg || base.bg;
  col.dataset.side = side;
  col.innerHTML = `
    <h2>${base.label} <span class="badge ${base.badgeClass}">${base.badge}</span>
      <button class="btn-apply" data-apply="${side}">⬇ 应用此列为正式基底</button>
      <span class="hint">点组件换色 · 点空白换背景</span></h2>
    <div class="swatches">${swatchHtml}</div>
    <div class="sect">组件模拟 <span class="tip">（点击任意元素循环 6 色）</span></div>
    <div class="ui">
      <div class="ui-left">
        <div class="row">${row1}</div>
        <div class="card" style="${base.cardStyle}">${cardComp}</div>
      </div>
      <div class="bg-block" data-role="bg" data-side="${side}" title="点击循环换背景">
        <div class="bg-dot" style="background:${st.bg || base.bg}"></div>
        <span>背景</span>
        <span style="font-size:10px;letter-spacing:0;opacity:.7">点击循环</span>
      </div>
    </div>`;
  $("note").innerHTML = `<b>${base.label}</b>：${base.note}`;
}

// ═══════════ 选色：当前基底 6 色循环 ═══════════
// 点击组件 → 在当前基底 swatches（6 色）中循环切换；背景类组件换 background+对比文字色，文字类换 color。
function swatchPool(side) {
  const base = BASES[state[side].base];
  return (base && base.swatches && base.swatches.length ? base.swatches : []);
}
function cycleColor(side, role) {
  const pool = swatchPool(side);
  if (!pool.length) return;
  const comp = state[side].comps[role];
  const curHex = /#([0-9a-fA-F]{6})/i.exec(comp.style)?.[0]?.toUpperCase() || "";
  let idx = pool.findIndex((s) => s.hex.toUpperCase() === curHex);
  idx = (idx + 1) % pool.length; // 找不到（自定义色）→ 从第 0 个开始
  const sw = pool[idx];
  const hex = sw.hex;
  const tc = textColorFor(hex);
  let style = comp.style;
  if (/background:/.test(style)) {
    // 背景类：换 background + 文字对比色
    style = style.replace(/background:[^;]+;?/, `background:${hex};`);
    if (/color:#[0-9a-fA-F]{6}/.test(style)) style = style.replace(/color:#[0-9a-fA-F]{6}/, `color:${tc}`);
  } else {
    // 文字类：换 color
    style = style.replace(/color:#[0-9a-fA-F]{6}/, `color:${hex}`);
  }
  if (/text-shadow/.test(style) && hexToRgb(hex)) {
    style = style.replace(/rgba\([^)]*,\s*0\.5\)/, withAlpha(hex, 0.5));
  }
  comp.style = style;
  renderCol(side);
  toast(`${sw.name} ${hex} → ${role}`);
}
// 点击背景块 → 在当前基底 6 色（swatches）中循环切换背景
function cycleBg(side) {
  const pool = swatchPool(side);
  if (!pool.length) return;
  const st = state[side];
  const cur = (st.bg || BASES[st.base].bg).toLowerCase();
  const poolHex = pool.map((s) => s.hex.toLowerCase());
  let idx = poolHex.indexOf(cur);
  idx = (idx + 1) % pool.length;
  st.bg = pool[idx].hex;
  renderCol(side);
  toast(`背景 ${pool[idx].name} ${pool[idx].hex} → ${side} 列`);
}// 应用指定列为正式基底：把该列颜色打包（6 色 + bg）POST /api/theme-apply
async function applyCol(side) {
  const st = state[side];
  const base = BASES[st.base];
  const getHex = (role, fallback) => {
    const comp = st.comps[role];
    const m = comp && /#([0-9a-fA-F]{6})/i.exec(comp.style);
    return (m ? m[1] : fallback).toUpperCase();
  };
  // 组件 → 6 色映射（与生成器语义一致）
  const colors = {
    bg: (st.bg || base.bg).toUpperCase(),
    bgSoft: base.bgSoft || "#101020",
    bgLayer: base.bgLayer || "#161222",
    skin: getHex("text-primary", "#FDF0FA"),
    hair: getHex("text-dim", "#C8B8D8"),
    eye: getHex("btn-primary", "#6B8E5A"),
    white: getHex("chip-active", "#F0F0F5"),
    purple: getHex("btn-secondary", "#8A6D9B"),
    gold: getHex("gold-glow", "#D4AF37"),
  };
  const btn = document.querySelector(`[data-apply="${side}"]`);
  if (btn) { btn.disabled = true; btn.textContent = "应用中…"; }
  try {
    const resp = await fetch("/api/theme-apply", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: base.label, colors }),
    });
    const j = await resp.json();
    toast(j.ok ? `✅ 已应用 ${base.label}（${side} 列）为正式基底` : `✗ ${j.error || "应用失败"}`);
    if (!j.ok) console.error("apply 失败:", j);
  } catch (err) { toast(`✗ ${err.message}`); }
  if (btn) { btn.disabled = false; btn.textContent = "⬇ 应用此列为正式基底"; }
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1600);
}

// ═══════════ 事件 ═══════════
function initSelects() {
  const opts = Object.keys(BASES).map((id) => `<option value="${id}">${BASES[id].label}</option>`).join("");
  $("pickL").innerHTML = opts; $("pickR").innerHTML = opts;
  $("pickL").value = state.L.base; $("pickR").value = state.R.base;
  $("pickL").addEventListener("change", () => { state.L.base = $("pickL").value; state.L.comps = {}; renderCol("L"); });
  $("pickR").addEventListener("change", () => { state.R.base = $("pickR").value; state.R.comps = {}; renderCol("R"); });
}
document.addEventListener("click", (e) => {
  // 应用按钮
  const applyBtn = e.target.closest(".btn-apply");
  if (applyBtn) { applyCol(applyBtn.dataset.apply); return; }
  // 背景切换空块（组件区右侧）
  const bgBlock = e.target.closest(".bg-block");
  if (bgBlock) { cycleBg(bgBlock.dataset.side); return; }
  // 组件换色
  const comp = e.target.closest(".comp");
  if (comp) { cycleColor(comp.dataset.side, comp.dataset.role); return; }
  // 点击列空白（.col 自身，非内部元素）→ 换背景
  const col = e.target.closest(".col");
  if (col && e.target === col) { cycleBg(col.dataset.side); return; }
});
$("btnReset").addEventListener("click", () => { state.L.comps = {}; state.R.comps = {}; renderCol("L"); renderCol("R"); toast("已重置默认配色"); });

// ═══════════ 导出 CSS（落盘 preview/generated/，格式兼容 /api/theme-bases 回读） ═══════════
function genCssFor(side) {
  const st = state[side];
  const base = BASES[st.base];
  const name = side === "L" ? "left" : "right";
  const lines = [`/* ${base.label} — 配色导出（${side} 列） */`, ":root {", `  --swatch-label: "${base.label}";`];
  // 6 色 + 背景（回读重建基底）
  if (base.swatches && base.swatches.length) {
    const sixKey = ['skin', 'hair', 'eye', 'white', 'purple', 'gold'];
    const sixName = { skin: '肤色', hair: '发色', eye: '瞳色', white: '礼服灰白', purple: '礼服紫', gold: '点缀金' };
    for (const s of base.swatches) {
      const k = Object.keys(sixName).find((kk) => sixName[kk] === s.name);
      if (k) lines.push(`  --swatch-${k}: ${s.hex.toUpperCase()};`);
      else lines.push(`  /* ${s.name}: ${s.hex} */`);
    }
  }
  lines.push(`  --swatch-bg: ${(st.bg || base.bg).toUpperCase()};`);
  if (base.bgSoft) lines.push(`  --swatch-bgSoft: ${base.bgSoft.toUpperCase()};`);
  if (base.bgLayer) lines.push(`  --swatch-bgLayer: ${base.bgLayer.toUpperCase()};`);
  // 组件色
  for (const role of Object.keys(st.comps)) {
    const comp = st.comps[role];
    const color = /#([0-9a-f]{6})/i.exec(comp.style)?.[0];
    if (color) lines.push(`  --swatch-${role}: ${color.toUpperCase()};`);
  }
  lines.push("}");
  return lines.join("\n");
}
$("btnExport").addEventListener("click", async () => {
  $("btnExport").disabled = true;
  const results = [];
  for (const side of ["L", "R"]) {
    const st = state[side];
    const baseId = st.base;
    const css = genCssFor(side);
    try {
      const resp = await fetch("/api/theme-save", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: baseId + "-" + side.toLowerCase(), css }),
      });
      const j = await resp.json();
      results.push(`${j.ok ? "✓" : "✗"} ${j.path || j.error}`);
    } catch (err) { results.push(`✗ ${side}: ${err.message}`); }
  }
  toast("导出完成：" + results.join(" | "));
  $("btnExport").disabled = false;
});

// ═══════════ 启动（基底动态加载后初始化） ═══════════
(async function boot() {
  await loadBases();
  const ids = Object.keys(BASES);
  // 默认基底校验：不存在则回退第一个（动态目录可能变化）
  for (const side of ["L", "R"]) {
    if (!BASES[state[side].base] && ids.length) state[side].base = ids[0];
  }
  if (!ids.length) {
    $("note").innerHTML = "⚠️ 基底加载失败（/api/theme-bases 无返回），请检查预览服务器";
    return;
  }
  initSelects();
  renderCol("L"); renderCol("R");
})();
</script>
</body>
</html>
